<!DOCTYPE html>
<html>
<head>
<style>
:root {
  --card-width: 200px;
  --card-height: 200px;
  --total-items: 6;
  --radius: 173px; /* Calculated radius for 6 cards */
}

.container {
  width: var(--card-width);
  height: var(--card-height);
  margin: 80px auto;
  perspective: 1000px;
}

.carousel {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: spin 20s infinite linear;
}

.card {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  background: linear-gradient(to bottom, red, yellow);
  color: white;
  font-size: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  transform: 
    rotateY(calc(var(--index) * (360deg / var(--total-items)))) 
    translateZ(var(--radius));
}

@keyframes spin {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(360deg); }
}

.carousel:hover {
  animation-play-state: paused;
}
</style>
</head>
<body>

<h1>CSS 3D Carousel</h1>

<div class="container">
  <div class="carousel">
    <div class="card" style="--index:0;">1</div>
    <div class="card" style="--index:1;">2</div>
    <div class="card" style="--index:2;">3</div>
    <div class="card" style="--index:3;">4</div>
    <div class="card" style="--index:4;">5</div>
    <div class="card" style="--index:5;">6</div>
  </div>
</div>

</body>
</html>
