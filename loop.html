<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Loops</h1>
<h2>The for Loop</h2>


<p id="guptaji"></p>

<script>
const car = ["BMW","RR","THE LEGEND ALTO","THAR","FORTUNER","NESAAN GTR"];

let gupta=""
for (let k =  0; k < car.length;k++){
  gupta += car[k] + " sanket legend keh garage meh " + "<br>";
}

document.getElementById("guptaji").innerHTML = gupta;
</script>

<p id="p"></p>

<script>
let lala="";

for (let k = 1; k < 11; k++) {
  lala += "tik tik " + k + "<br>";
}

document.getElementById("p").innerHTML = lala;
</script>

</body>
</html>
